<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Velora — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { margin: 0; overflow: hidden; }

        .login-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Left side — form */
        .login-left {
            width: 42%;
            background: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
            flex-shrink: 0;
        }

        .login-form { width: 100%; max-width: 340px; }

        .auth-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.6rem;
            font-weight: 700;
            color: var(--navy);
            letter-spacing: 3px;
            margin-bottom: 4px;
        }

        .auth-motto {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--teal);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .form-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--navy);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .login-form label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--navy);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .login-form input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            background: white;
            color: var(--navy);
            outline: none;
        }

        .login-form input:focus { border-color: var(--teal); }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: var(--navy);
            color: var(--cream);
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
            margin-bottom: 0;
        }

        .login-btn:hover { background: var(--teal); }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.82rem;
            color: var(--navy);
        }

        .register-link a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 600;
        }

        .msg {
            font-size: 0.82rem;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }

        /* Right side — slideshow */
        .login-right {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.4s ease-in-out;
        }

        .slide.active { opacity: 1; }

        .slide-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(18,33,46,0.7) 0%,
                rgba(18,33,46,0.1) 60%
            );
        }

        .slide-caption {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: var(--cream);
            z-index: 2;
        }

        .slide-caption h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.4rem;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 4px;
            color: var(--cream);
        }

        .slide-caption p {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(236,231,220,0.7);
        }

        .slide-dots {
            position: absolute;
            bottom: 20px;
            right: 30px;
            display: flex;
            gap: 8px;
            z-index: 3;
        }

        .slide-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(236,231,220,0.35);
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .slide-dot.active { background: var(--orange); }
    </style>
</head>
<body>

<div class="login-wrapper">

    <!-- Left: Form -->
    <div class="login-left">
        <div class="login-form">
            <div class="auth-logo">Velora</div>
            <div class="auth-motto">New sanctuaries await</div>
            <div class="form-title">Sign In</div>

            <label>Email</label>
            <input type="email" id="email" placeholder="your@email.com" />

            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••"
                onkeydown="if(event.key==='Enter') login()" />

            <button class="login-btn" onclick="login()">Continue</button>
            <p id="msg" class="msg"></p>

            <div class="register-link">
                No account? <a href="/register.html">Register</a>
            </div>
        </div>
    </div>

    <!-- Right: Slideshow -->
    <div class="login-right">
        <div class="slide active" id="s0"
            style="background-image:url('/static/uploads/badshahi.jpg')">
            <div class="slide-overlay"></div>
        </div>
        <div class="slide" id="s1"
            style="background-image:url('/static/uploads/faisal_mosque.jpg')">
            <div class="slide-overlay"></div>
        </div>
        <div class="slide" id="s2"
            style="background-image:url('/static/uploads/sea_view.jpg')">
            <div class="slide-overlay"></div>
        </div>
        <div class="slide" id="s3"
            style="background-image:url('/static/uploads/nanga_parbat.jpg')">
            <div class="slide-overlay"></div>
        </div>
        <div class="slide" id="s4"
            style="background-image:url('/static/uploads/multan.jpg')">
            <div class="slide-overlay"></div>
        </div>

        <div class="slide-caption">
            <h2 id="cap-name">Badshahi Mosque</h2>
            <p id="cap-city">Lahore, Pakistan</p>
        </div>

        <div class="slide-dots" id="dots"></div>
    </div>

</div>

<script>
const slides = [
    { name: "Badshahi Mosque",  city: "Lahore, Pakistan"    },
    { name: "Faisal Mosque",    city: "Islamabad, Pakistan" },
    { name: "Sea View",         city: "Karachi, Pakistan"   },
    { name: "Nanga Parbat",     city: "Gilgit, Pakistan"    },
    { name: "Multan",           city: "Multan, Pakistan"    }
];

let cur = 0;

// Build dots
const dotsDiv = document.getElementById('dots');
slides.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'slide-dot' + (i === 0 ? ' active' : '');
    d.onclick   = () => goTo(i);
    dotsDiv.appendChild(d);
});

function goTo(index) {
    document.getElementById('s' + cur).classList.remove('active');
    dotsDiv.children[cur].classList.remove('active');
    cur = index;
    document.getElementById('s' + cur).classList.add('active');
    dotsDiv.children[cur].classList.add('active');
    document.getElementById('cap-name').textContent = slides[cur].name;
    document.getElementById('cap-city').textContent = slides[cur].city;
}

setInterval(() => goTo((cur + 1) % slides.length), 4000);

async function login() {
    const email    = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const msg      = document.getElementById('msg');

    if (!email || !password) {
        msg.textContent = 'Please fill in all fields.';
        msg.style.color = '#c0392b';
        return;
    }

    const res  = await fetch('/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (res.ok) {
        window.location.href = '/home.html';
    } else {
        msg.textContent = data.error;
        msg.style.color = '#c0392b';
    }
}
</script>

</body>
</html>
